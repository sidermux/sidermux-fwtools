[workspace]
resolver = "3"
members = [
    "sidermux-image",
    "sidermux-fwtools",
    "cargo-sidermux",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sidermux/sidermux-fwtools"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Results-returning APIs document errors at the type level; panic paths are
# confined to validated internals.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Binary-format code converts between byte offsets (u64 sources) and in-memory
# sizes (usize) after bounds have been validated; narrowing casts there are
# deliberate and ubiquitous.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
# Domain prose is dense with fixed-width acronyms (ELF, FPGA, MBR, CRC).
doc_markdown = "allow"

[workspace.dependencies]
sidermux-image = { path = "sidermux-image", version = "0.1.0", default-features = false }
sidermux-fwtools = { path = "sidermux-fwtools", version = "0.1.0", default-features = false }

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true
