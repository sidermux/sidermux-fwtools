[package]
name = "cargo-sidermux"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Package, inspect, and unpack SoC FPGA boot images"
readme = "README.md"
keywords = ["embedded", "fpga", "firmware", "bootloader", "cargo-subcommand"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sidermux-fwtools = { workspace = true, default-features = false }
miette = { version = "7.6.0", features = ["fancy"] }
serde_json = "1.0.145"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["cyclone-v", "board-de1-soc"]
cyclone-v = ["sidermux-fwtools/cyclone-v"]
board-de1-soc = ["cyclone-v", "sidermux-fwtools/board-de1-soc"]
